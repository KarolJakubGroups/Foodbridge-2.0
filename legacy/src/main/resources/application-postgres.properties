spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/foodbridge}
spring.datasource.username=${DATABASE_USER:foodbridge}
spring.datasource.password=${DATABASE_PASSWORD:foodbridge}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
server.servlet.session.cookie.secure=true
