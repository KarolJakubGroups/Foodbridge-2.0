spring.application.name=foodbridge
server.port=8085

# Default profile: H2 persisted to ./data so donations survive restarts.
# Use --spring.profiles.active=postgres for PostgreSQL (see application-postgres.properties).
spring.datasource.url=jdbc:h2:file:./data/foodbridge;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Session cookie hardening for the same-origin SPA
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=8h

spring.jackson.serialization.write-dates-as-timestamps=false
